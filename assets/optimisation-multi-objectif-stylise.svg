<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrière-plan dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f9f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour le front de Pareto -->
    <linearGradient id="paretoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtre d'ombre pour les éléments -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000044" />
    </filter>
  </defs>
  
  <!-- Arrière-plan -->
  <rect x="0" y="0" width="800" height="600" fill="url(#bgGradient)" rx="10" ry="10" />
  
  <!-- Titre élégant -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50" filter="url(#shadow)">Optimisation Multi-Objectif</text>
  <line x1="250" y1="65" x2="550" y2="65" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Système de coordonnées avec style -->
  <g transform="translate(100, 460)">
    <!-- Zone de graphique avec grille légère -->
    <rect x="0" y="-380" width="600" height="380" fill="#ffffff" stroke="#cccccc" stroke-width="0.5" rx="5" ry="5" filter="url(#shadow)" />
    
    <!-- Grille légère -->
    <g stroke="#e5e5e5" stroke-width="0.5">
      <line x1="0" y1="-100" x2="600" y2="-100" />
      <line x1="0" y1="-200" x2="600" y2="-200" />
      <line x1="0" y1="-300" x2="600" y2="-300" />
      
      <line x1="100" y1="0" x2="100" y2="-380" />
      <line x1="200" y1="0" x2="200" y2="-380" />
      <line x1="300" y1="0" x2="300" y2="-380" />
      <line x1="400" y1="0" x2="400" y2="-380" />
      <line x1="500" y1="0" x2="500" y2="-380" />
    </g>
    
    <!-- Axes élégants -->
    <line x1="0" y1="0" x2="620" y2="0" stroke="#2c3e50" stroke-width="3" />
    <line x1="0" y1="0" x2="0" y2="-400" stroke="#2c3e50" stroke-width="3" />
    
    <!-- Flèches des axes -->
    <polygon points="620,0 610,-5 610,5" fill="#2c3e50" />
    <polygon points="0,-400 -5,-390 5,-390" fill="#2c3e50" />
    
    <!-- Étiquettes des axes stylisées -->
    <text x="620" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Objectif 1</text>
    <text x="-40" y="-400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" transform="rotate(-90, -40, -400)">Objectif 2</text>
    
    <!-- Région non-réalisable avec dégradé -->
    <path d="M20,-20 C120,-100 300,-150 550,-100 L550,-20 L20,-20 Z" fill="#f5f5f566" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="5,5" />
    <text x="280" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888888" font-style="italic">Région non-réalisable</text>
    
    <!-- Points de l'espace de solutions avec effet -->
    <g>
      <!-- Points dominés avec transparence et effet -->
      <circle cx="100" cy="-50" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="150" cy="-80" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="200" cy="-100" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="120" cy="-150" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="250" cy="-120" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="180" cy="-180" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="300" cy="-140" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="220" cy="-220" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="350" cy="-160" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="260" cy="-260" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="400" cy="-180" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      <circle cx="300" cy="-300" r="5" fill="#ff7675" fill-opacity="0.7" stroke="#e74c3c" stroke-width="1" />
      
      <!-- Zone de l'espace dominé -->
      <path d="M80,-180 L450,-180 L450,-350 L80,-180 Z" fill="#ff76753a" stroke="none" />
      
      <!-- Front de Pareto élégant avec dégradé -->
      <path d="M80,-180 C150,-240 230,-300 450,-350" fill="none" stroke="url(#paretoGradient)" stroke-width="3" stroke-linecap="round" filter="url(#shadow)" />
      
      <!-- Points du front de Pareto avec effet de brillance -->
      <circle cx="80" cy="-180" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="150" cy="-240" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="230" cy="-300" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="330" cy="-330" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="450" cy="-350" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow)" />
    </g>
    
    <!-- Direction de l'optimisation stylisée -->
    <g transform="translate(500, -300)">
      <text x="0" y="-15" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Direction de</text>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">l'optimisation</text>
      <path d="M0,20 L-12,10 L-8,30 L0,60 L8,30 L12,10 Z" fill="url(#paretoGradient)" stroke="#2c3e50" stroke-width="1" filter="url(#shadow)" />
    </g>
    
    <!-- Légende élégante -->
    <g transform="translate(450, -100)">
      <rect x="0" y="0" width="140" height="85" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" rx="5" ry="5" filter="url(#shadow)" />
      
      <circle cx="20" cy="25" r="5" fill="#ff7675" stroke="#e74c3c" stroke-width="1" />
      <text x="35" y="30" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Solutions dominées</text>
      
      <circle cx="20" cy="55" r="7" fill="#3498db" stroke="#ffffff" stroke-width="1.5" />
      <text x="35" y="60" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Front de Pareto</text>
    </g>
    
    <!-- Label de l'espace réalisable -->
    <text x="250" y="-260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Espace de solutions réalisables</text>
  </g>
</svg>
