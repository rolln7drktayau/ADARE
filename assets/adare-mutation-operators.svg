<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients, filters and patterns -->
  <defs>
    <!-- Title gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3949AB" />
      <stop offset="100%" stop-color="#5C6BC0" />
    </linearGradient>

    <!-- Background gradients -->
    <linearGradient id="swapGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD" />
      <stop offset="100%" stop-color="#BBDEFB" />
    </linearGradient>
    
    <linearGradient id="valueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    
    <linearGradient id="gradientMutationBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>

    <!-- Task gradients -->
    <linearGradient id="task1Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9E80" />
      <stop offset="100%" stop-color="#FF7043" />
    </linearGradient>
    
    <linearGradient id="task2Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    
    <linearGradient id="task3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AED581" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>

    <linearGradient id="task5Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Node gradients -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B39DDB" />
      <stop offset="100%" stop-color="#7E57C2" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#333" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effects -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="440" fill="#F5F5F5" />
  
  <!-- Title -->
  <g filter="url(#shadow)">
    <rect x="200" y="10" width="400" height="40" rx="10" fill="url(#titleGradient)" />
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">ADARE Mutation Operators</text>
  </g>
  
  <!-- Swap Mutation -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="150" fill="url(#swapGradient)" stroke="#1976D2" stroke-width="3" rx="15" filter="url(#shadow)"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565C0">Swap Mutation</text>
    
    <!-- Before -->
    <g transform="translate(20, 0)">
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Before:</text>
      <g transform="translate(20, 70)" filter="url(#glow)">
        <rect x="0" y="0" width="35" height="35" fill="url(#task1Gradient)" rx="5" stroke="#E64A19" stroke-width="1"/>
        <text x="17.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T1</text>
        
        <rect x="45" y="0" width="35" height="35" fill="url(#task2Gradient)" rx="5" stroke="#0D47A1" stroke-width="1"/>
        <text x="62.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T2</text>
        
        <rect x="90" y="0" width="35" height="35" fill="url(#task3Gradient)" rx="5" stroke="#33691E" stroke-width="1"/>
        <text x="107.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T3</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(160, 87.5)">
      <path d="M0 0 L40 0" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <polygon points="40,0 30,-7 30,7" fill="#333"/>
    </g>
    
    <!-- After -->
    <g transform="translate(170, 0)">
      <text x="70" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold">After:</text>
      <g transform="translate(70, 70)" filter="url(#glow)">
        <rect x="0" y="0" width="35" height="35" fill="url(#task2Gradient)" rx="5" stroke="#0D47A1" stroke-width="1"/>
        <text x="17.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T2</text>
        
        <rect x="45" y="0" width="35" height="35" fill="url(#task1Gradient)" rx="5" stroke="#E64A19" stroke-width="1"/>
        <text x="62.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T1</text>
        
        <rect x="90" y="0" width="35" height="35" fill="url(#task3Gradient)" rx="5" stroke="#33691E" stroke-width="1"/>
        <text x="107.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T3</text>
      </g>
    </g>
    
    <rect x="40" y="120" width="240" height="25" rx="12.5" fill="rgba(255,255,255,0.7)"/>
    <text x="160" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
      Swaps task assignments between two random nodes
    </text>
  </g>
  
  <!-- Value Mutation -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="150" fill="url(#valueGradient)" stroke="#2E7D32" stroke-width="3" rx="15" filter="url(#shadow)"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1B5E20">Value Mutation</text>
    
    <!-- Before -->
    <g transform="translate(20, 0)">
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Before:</text>
      <g transform="translate(20, 70)" filter="url(#glow)">
        <rect x="0" y="0" width="35" height="35" fill="url(#task1Gradient)" rx="5" stroke="#E64A19" stroke-width="1"/>
        <text x="17.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T1</text>
        <text x="60" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="500">→ Node 3</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(160, 87.5)">
      <path d="M0 0 L40 0" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <polygon points="40,0 30,-7 30,7" fill="#333"/>
    </g>
    
    <!-- After -->
    <g transform="translate(170, 0)">
      <text x="70" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold">After:</text>
      <g transform="translate(70, 70)" filter="url(#glow)">
        <rect x="0" y="0" width="35" height="35" fill="url(#task1Gradient)" rx="5" stroke="#E64A19" stroke-width="1"/>
        <text x="17.5" y="22.5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T1</text>
        <text x="60" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="500">→ Node 7</text>
      </g>
    </g>
    
    <rect x="40" y="120" width="240" height="25" rx="12.5" fill="rgba(255,255,255,0.7)"/>
    <text x="160" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
      Changes node assignment for a single task
    </text>
  </g>
  
  <!-- Gradient Mutation -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="700" height="160" fill="url(#gradientMutationBg)" stroke="#C2185B" stroke-width="3" rx="15" filter="url(#shadow)"/>
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#880E4F">Gradient Mutation</text>
    
    <!-- Diagram -->
    <g transform="translate(30, 50)">
      <!-- Nodes -->
      <g transform="translate(30, 0)" filter="url(#glow)">
        <circle cx="20" cy="50" r="22" fill="url(#nodeGradient)" stroke="#4527A0" stroke-width="2"/>
        <text x="20" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">N1</text>
        
        <rect x="0" y="85" width="40" height="20" rx="10" fill="rgba(255,255,255,0.7)"/>
        <text x="20" y="99" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Load: 80%</text>
        
        <!-- Load indicator -->
        <rect x="5" y="75" width="30" height="5" rx="2.5" fill="#EEEEEE" stroke="#333" stroke-width="0.5"/>
        <rect x="5" y="75" width="24" height="5" rx="2.5" fill="#FF5252"/>
      </g>
      
      <g transform="translate(120, 0)" filter="url(#glow)">
        <circle cx="20" cy="50" r="22" fill="url(#nodeGradient)" stroke="#4527A0" stroke-width="2"/>
        <text x="20" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">N2</text>
        
        <rect x="0" y="85" width="40" height="20" rx="10" fill="rgba(255,255,255,0.7)"/>
        <text x="20" y="99" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Load: 65%</text>
        
        <!-- Load indicator -->
        <rect x="5" y="75" width="30" height="5" rx="2.5" fill="#EEEEEE" stroke="#333" stroke-width="0.5"/>
        <rect x="5" y="75" width="19.5" height="5" rx="2.5" fill="#FFA726"/>
      </g>
      
      <g transform="translate(210, 0)" filter="url(#glow)">
        <circle cx="20" cy="50" r="22" fill="url(#nodeGradient)" stroke="#4527A0" stroke-width="2"/>
        <text x="20" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">N3</text>
        
        <rect x="0" y="85" width="40" height="20" rx="10" fill="rgba(255,255,255,0.7)"/>
        <text x="20" y="99" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Load: 40%</text>
        
        <!-- Load indicator -->
        <rect x="5" y="75" width="30" height="5" rx="2.5" fill="#EEEEEE" stroke="#333" stroke-width="0.5"/>
        <rect x="5" y="75" width="12" height="5" rx="2.5" fill="#66BB6A"/>
      </g>
      
      <!-- Task -->
      <g transform="translate(350, 35)" filter="url(#glow)">
        <rect x="0" y="0" width="40" height="30" fill="url(#task5Gradient)" rx="5" stroke="#FF6F00" stroke-width="1"/>
        <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T5</text>
      </g>
      
      <!-- Arrows -->
      <g transform="translate(0, 0)">
        <!-- Current Assignment -->
        <path d="M390 50 L425 50" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="425,50 415,45 415,55" fill="#333"/>
        
        <!-- Alternative path (dashed) -->
        <path d="M370 50 Q230 15, 140 50" stroke="#0277BD" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
        <polygon points="140,50 150,45 150,55" fill="#0277BD"/>
        
        <!-- Best path -->
        <path d="M370 50 Q295 20, 230 50" stroke="#388E3C" stroke-width="2.5" fill="none"/>
        <polygon points="230,50 240,45 240,55" fill="#388E3C"/>
      </g>
      
      <!-- Legend -->
      <g transform="translate(450, 20)">
        <rect x="0" y="0" width="180" height="80" rx="10" fill="rgba(255,255,255,0.7)"/>
        
        <circle cx="15" cy="20" r="6" fill="#FF5252"/>
        <text x="30" y="25" font-family="Arial, sans-serif" font-size="14">Current: N1 (80%)</text>
        
        <circle cx="15" cy="50" r="6" fill="#66BB6A"/>
        <text x="30" y="55" font-family="Arial, sans-serif" font-size="14" fill="#388E3C">Best: N3 (40%)</text>
        
        <circle cx="15" cy="80" r="6" fill="#FFA726"/>
        <text x="30" y="85" font-family="Arial, sans-serif" font-size="14" fill="#0277BD">Possible: N2 (65%)</text>
      </g>
    </g>
    
    <rect x="130" y="130" width="440" height="25" rx="12.5" fill="rgba(255,255,255,0.7)"/>
    <text x="350" y="147" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">
      Moves tasks toward underutilized nodes based on load gradient
    </text>
  </g>
  
  <!-- Footer -->
  <rect x="150" y="415" width="500" height="25" rx="12.5" fill="rgba(27,94,32,0.1)" filter="url(#shadow)"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#333">
    ADARE dynamically selects operators based on solution density and generation progress
  </text>
</svg>
