<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients for boxes -->
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#4F46E5" />
        </linearGradient>
        <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#EC4899" />
          <stop offset="100%" stop-color="#BE185D" />
        </linearGradient>
        <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#10B981" />
          <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F59E0B" />
          <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3B82F6" />
          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
        <linearGradient id="gradient6" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8B5CF6" />
          <stop offset="100%" stop-color="#7C3AED" />
        </linearGradient>
        <linearGradient id="gradient7" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#EF4444" />
          <stop offset="100%" stop-color="#DC2626" />
        </linearGradient>
        <linearGradient id="gradient8" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#14B8A6" />
          <stop offset="100%" stop-color="#0D9488" />
        </linearGradient>
        
        <!-- Background gradient -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>
        
        <!-- Arrow markers -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>

        
        <!-- Drop shadow -->
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.2)" />
        </filter>
        
        <!-- Glow effect -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      
      <!-- Background -->
      <rect x="0" y="0" width="1000" height="600" fill="url(#bgGradient)" />
      
      <!-- Title -->
      <text x="500" y="40" font-family="'Montserrat', sans-serif" font-size="24" 
            font-weight="bold" fill="#1e293b" text-anchor="middle" filter="url(#drop-shadow)">
        Algorithme d'Optimisation Multi-Objectif avec Q-Learning
      </text>
      
      <!-- Boxes with modern styling -->
      <rect x="50" y="70" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient1)" filter="url(#drop-shadow)" />
      <text x="150" y="105" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Initialisation</text>
      
      <rect x="300" y="70" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient2)" filter="url(#drop-shadow)" />
      <text x="400" y="95" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Adaptation</text>
      <text x="400" y="115" font-family="'Roboto', sans-serif" font-size="14" 
            fill="white" text-anchor="middle">(α, densité)</text>
      
      <rect x="550" y="70" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient3)" filter="url(#drop-shadow)" />
      <text x="650" y="105" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Sélection des parents</text>
      
      <rect x="300" y="170" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient4)" filter="url(#drop-shadow)" />
      <text x="400" y="195" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Q-Learning Croisement</text>
      <text x="400" y="215" font-family="'Roboto', sans-serif" font-size="14" 
            fill="white" text-anchor="middle">ε-greedy + opérateurs</text>
      
      <rect x="50" y="270" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient5)" filter="url(#drop-shadow)" />
      <text x="150" y="295" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Mutation Adaptative</text>
      <text x="150" y="315" font-family="'Roboto', sans-serif" font-size="14" 
            fill="white" text-anchor="middle">selon densité &amp; tâche</text>
      
      <rect x="300" y="270" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient6)" filter="url(#drop-shadow)" />
      <text x="400" y="305" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">Évaluation</text>
      
      <rect x="550" y="270" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient7)" filter="url(#drop-shadow)" />
      <text x="650" y="295" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">MàJ Q-table</text>
      <text x="650" y="315" font-family="'Roboto', sans-serif" font-size="14" 
            fill="white" text-anchor="middle">Δ fitness + α_eff</text>
      
      <rect x="300" y="380" width="200" height="60" rx="15" ry="15" 
            fill="url(#gradient8)" filter="url(#drop-shadow)" />
      <text x="400" y="405" font-family="'Roboto', sans-serif" font-size="16" 
            font-weight="bold" fill="white" text-anchor="middle">NSGA-III</text>
      <text x="400" y="425" font-family="'Roboto', sans-serif" font-size="14" 
            fill="white" text-anchor="middle">sélection finale</text>
      
      <!-- Fancy arrows -->
      <line x1="250" y1="100" x2="280" y2="100" stroke="#64748b" stroke-width="2" 
            marker-end="url(#arrowhead)" stroke-linecap="round" />
      <line x1="500" y1="100" x2="530" y2="100" stroke="#64748b" stroke-width="2" 
            marker-end="url(#arrowhead)" stroke-linecap="round" />
      
      <!-- Curved arrows -->
      <path d="M 650,130 Q 650,150 525,150 Q 400,150 400,165" 
            fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" 
            stroke-linecap="round" />

      <path d="M 400,230 Q 400,250 275,250 Q 150,250 150,270" 
            fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" 
            stroke-linecap="round" />
      
      <path d="M 400,230 L 400,260" 
            fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" 
            stroke-linecap="round" />
      
      <path d="M 400,330 L 400,370" 
            fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" 
            stroke-linecap="round" />
      
      <path d="M 650,330 Q 650,355 525,355 Q 400,355 400,380" 
            fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" 
            stroke-linecap="round" />
      
      <!-- Loop back arrow with animation -->
      <path d="M 300,410 Q 200,410 200,130 Q 200,70 250,70" 
            fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10,5" 
            marker-end="url(#arrowhead)" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="15" to="0" dur="3s" repeatCount="indefinite" />
      </path>
      
      <!-- Labels with elegant styling -->
      <text x="200" y="150" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#475569" text-anchor="middle" font-style="italic">densité</text>
      
      <text x="240" y="240" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#475569" text-anchor="middle" font-style="italic">enfant muté</text>
      
      <text x="500" y="245" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#475569" text-anchor="middle" font-style="italic">fitness</text>
      
      <!-- Information boxes with icons -->
      <rect x="800" y="120" width="180" height="360" rx="15" ry="15" 
            fill="rgba(255, 255, 255, 0.8)" stroke="#64748b" stroke-width="2" />
      
      <text x="890" y="150" font-family="'Montserrat', sans-serif" font-size="16" 
            font-weight="bold" fill="#334155" text-anchor="middle">Légende</text>
      
      <circle cx="820" cy="180" r="10" fill="url(#gradient1)" />
      <text x="840" y="185" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Initialisation</text>
      
      <circle cx="820" cy="210" r="10" fill="url(#gradient2)" />
      <text x="840" y="215" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Adaptation</text>
      
      <circle cx="820" cy="240" r="10" fill="url(#gradient3)" />
      <text x="840" y="245" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Sélection</text>
      
      <circle cx="820" cy="270" r="10" fill="url(#gradient4)" />
      <text x="840" y="275" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Q-Learning</text>
      
      <circle cx="820" cy="300" r="10" fill="url(#gradient5)" />
      <text x="840" y="305" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Mutation</text>
      
      <circle cx="820" cy="330" r="10" fill="url(#gradient6)" />
      <text x="840" y="335" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Évaluation</text>
      
      <circle cx="820" cy="360" r="10" fill="url(#gradient7)" />
      <text x="840" y="365" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Mise à jour</text>
      
      <circle cx="820" cy="390" r="10" fill="url(#gradient8)" />
      <text x="840" y="395" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Sélection finale</text>
      
      <line x1="820" y1="420" x2="840" y2="420" stroke="#64748b" stroke-width="3" 
            marker-end="url(#arrowhead)" />
      <text x="860" y="425" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Flux principal</text>
      
      <line x1="820" y1="450" x2="840" y2="450" stroke="#475569" stroke-width="3" 
            stroke-dasharray="10,5" marker-end="url(#arrowhead)" />
      <text x="860" y="455" font-family="'Roboto', sans-serif" font-size="14" 
            fill="#334155" text-anchor="start">Bouclage</text>
    </svg>