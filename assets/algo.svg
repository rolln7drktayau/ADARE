<svg viewBox="0 0 800 1300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="1300" fill="#daedf5" />
  
  <!-- Title -->
  <text x="400" y="70" font-family="Arial" font-size="48" font-weight="bold" text-anchor="middle" fill="#0f2c3e">Adaptive NSGA-III Algorithm</text>
  
  <!-- Boxes and Flow -->
  <!-- Initialize population -->
  <rect x="150" y="120" width="300" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="155" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Initialize population</text>
  <text x="300" y="185" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">P of size N</text>
  
  <!-- Arrow down -->
  <path d="M300 220 L300 260" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,270 294,260 306,260" fill="#0f2c3e" />
  
  <!-- Initialize Q-table -->
  <rect x="150" y="270" width="300" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="305" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Initialize Q-table</text>
  <text x="300" y="335" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">and reference points</text>
  
  <!-- Arrow down -->
  <path d="M300 370 L300 410" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,420 294,410 306,410" fill="#0f2c3e" />
  
  <!-- Evaluate fitness -->
  <rect x="150" y="420" width="300" height="80" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="465" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Evaluate fitness of P</text>
  
  <!-- Arrow down -->
  <path d="M300 500 L300 540" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,550 294,540 306,540" fill="#0f2c3e" />
  
  <!-- Generate offspring -->
  <rect x="150" y="550" width="300" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="585" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Generate offspring</text>
  <text x="300" y="615" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">using adaptive operators</text>
  
  <!-- Arrow down -->
  <path d="M300 650 L300 690" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,700 294,690 306,690" fill="#0f2c3e" />
  
  <!-- Apply Q-Learning -->
  <rect x="110" y="700" width="380" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="735" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Apply Q-Learning based</text>
  <text x="300" y="765" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">crossover and mutation</text>
  
  <!-- Arrow down -->
  <path d="M300 800 L300 840" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,850 294,840 306,840" fill="#0f2c3e" />
  
  <!-- Evaluate offspring -->
  <rect x="150" y="850" width="300" height="80" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="895" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Evaluate offspring</text>
  
  <!-- Arrow down -->
  <path d="M300 930 L300 970" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,980 294,970 306,970" fill="#0f2c3e" />
  
  <!-- Combine populations -->
  <rect x="150" y="980" width="300" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="1015" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Combine populations:</text>
  <text x="300" y="1045" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">R ← P ∪ Offspring</text>
  
  <!-- Arrow down -->
  <path d="M300 1080 L300 1120" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="300,1130 294,1120 306,1120" fill="#0f2c3e" />
  
  <!-- NSGA-III selection -->
  <rect x="150" y="1130" width="300" height="100" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="300" y="1165" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">NSGA-III selection with</text>
  <text x="300" y="1195" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">reference points</text>
  
  <!-- Right side components -->
  <!-- Update Q-table box -->
  <rect x="500" y="420" width="250" height="150" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="625" y="465" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Update Q-table</text>
  <text x="625" y="495" font-family="Arial" font-size="22" text-anchor="middle" fill="#0f2c3e">based on</text>
  <text x="625" y="525" font-family="Arial" font-size="22" text-anchor="middle" fill="#0f2c3e">improvement</text>
  
  <!-- Small colored dots in the Q-table box -->
  <circle cx="575" cy="530" r="10" fill="#4caf50" />
  <circle cx="605" cy="510" r="10" fill="#ff9800" />
  <circle cx="635" cy="490" r="10" fill="#2196f3" />
  <circle cx="665" cy="520" r="10" fill="#673ab7" />
  
  <!-- Apply elitism box -->
  <rect x="500" y="850" width="250" height="150" rx="20" ry="20" fill="white" stroke="#0f2c3e" stroke-width="3" />
  <text x="625" y="895" font-family="Arial" font-size="24" text-anchor="middle" fill="#0f2c3e">Apply elitism</text>
  <text x="625" y="925" font-family="Arial" font-size="22" text-anchor="middle" fill="#0f2c3e">for each objective</text>
  
  <!-- Colored dots connected by dashed line for reference points -->
  <circle cx="575" cy="960" r="10" fill="#ff9800" />
  <circle cx="605" cy="950" r="10" fill="#4caf50" />
  <circle cx="635" cy="950" r="10" fill="#4caf50" />
  <circle cx="665" cy="940" r="10" fill="#673ab7" />
  <path d="M575 960 L665 940" stroke="#0f2c3e" stroke-width="2" stroke-dasharray="5,5" fill="none" />
  
  <!-- Connecting arrows -->
  <path d="M450 490 L500 490" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="490,490 500,485 500,495" fill="#0f2c3e" />
  
  <path d="M450 890 L500 920" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="490,915 500,920 490,925" fill="#0f2c3e" />
  
  <path d="M625 570 L625 630 L300 630" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="310,630 300,625 300,635" fill="#0f2c3e" />
  
  <path d="M625 1000 L625 1060 L300 1060" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="310,1060 300,1055 300,1065" fill="#0f2c3e" />
  
  <!-- Loop arrow from bottom to top -->
  <path d="M300 1230 L300 1260 L100 1260 L100 300 L150 300" stroke="#0f2c3e" stroke-width="3" fill="none" />
  <polygon points="140,300 150,295 150,305" fill="#0f2c3e" />
  <text x="125" y="1240" font-family="Arial" font-size="18" text-anchor="middle" fill="#0f2c3e">Next</text>
  <text x="125" y="1260" font-family="Arial" font-size="18" text-anchor="middle" fill="#0f2c3e">generation</text>
</svg>
